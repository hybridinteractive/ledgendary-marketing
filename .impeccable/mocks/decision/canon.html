<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#fff;color:#0f172a;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden;position:relative}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 72px;font-size:16px;color:#475569}
nav b{color:#0f172a;font-size:22px}
nav i{font-style:normal;background:#4f46e5;color:#fff;padding:10px 18px;border-radius:8px}
.copy{position:absolute;left:72px;top:190px;width:560px}
h1{font:700 64px/1.05 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em}
p{margin-top:22px;font-size:22px;line-height:1.5;color:#475569}
form{margin-top:34px;display:flex;gap:10px}
form span{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:16px;font-size:20px;color:#94a3b8}
form b{background:#4f46e5;color:#fff;border-radius:10px;padding:16px 24px;font-size:20px}
.shot{position:absolute;left:700px;top:150px;width:700px;height:470px;border-radius:14px;border:1px solid #e2e8f0;box-shadow:0 30px 60px rgba(15,23,42,.12);background:#f8fafc;padding:24px}
.bar{height:22px;background:#e2e8f0;border-radius:6px;margin-bottom:14px}
.cards{position:absolute;left:72px;right:72px;bottom:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.cards div{height:120px;border:1px solid #e2e8f0;border-radius:12px;padding:20px;font-size:22px;font-weight:600}
</style></head><body>
<nav><b>Ledgendary</b><span>Features · Agencies · Security</span><i>Join waitlist</i></nav>
<div class="copy"><h1>Agency finance, from proposal to paid.</h1><p>Proposals, time, invoices, payments and books in one place.</p><form><span>Work email</span><b>Join the waitlist</b></form></div>
<div class="shot"><div class="bar" style="width:40%"></div><div class="bar"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:65%"></div><div class="bar"></div></div>
<div class="cards"><div>Proposals</div><div>Time</div><div>Invoicing</div><div>Books</div></div>
</body></html>
